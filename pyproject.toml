[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot"
version = "0.1.0"
description = "Autonomous Spec-as-Oracle Testing and Regression Remediation Agent for CI/CD"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sourabh Jain", email = "sourabh@example.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.5.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "requests>=2.31.0",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
testpilot = "testpilot.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["testpilot*", "testbed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "*.egg", "tests/fixtures", "fixtures"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
